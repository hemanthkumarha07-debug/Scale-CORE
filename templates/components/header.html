<header class="scale-header">
  <div class="scale-breadcrumbs">
    <span style="font-weight: 600; color: var(--scale-text-primary);">{{ BRAND.NAME }}</span>
    <span>/</span>
    <span>{% block breadcrumb %}Enterprise Overview{% endblock %}</span>
  </div>

  <div class="scale-header-actions">
    <!-- Operational Automation Pill -->
    <div class="scale-badge scale-badge-healthy tabular-nums" title="Human Intervention Rate: Measure of autonomous operational efficiency">
      <span style="width: 6px; height: 6px; border-radius: 50%; background-color: var(--scale-healthy-text); margin-right: 6px; display: inline-block;"></span>
      AUTONOMOUS: 94.2%
    </div>

    <!-- System Health Pill -->
    <a href="/system-health/" style="text-decoration: none;">
      <div class="scale-badge scale-badge-info" title="System Infrastructure Health">
        HEALTHY
      </div>
    </a>

    <!-- Notifications Bell -->
    <a href="/notifications/" class="scale-btn scale-btn-secondary" style="padding: 6px 10px;" title="Operational Exception Hub">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
    </a>

    <!-- Account Actions -->
    {% if user.is_authenticated %}
      <a href="/accounts/logout/" class="scale-btn scale-btn-secondary" style="padding: 6px 12px; font-size: 12px;">Logout</a>
    {% else %}
      <a href="/accounts/login/" class="scale-btn scale-btn-primary" style="padding: 6px 12px; font-size: 12px;">Sign In</a>
    {% endif %}
  </div>
</header>
